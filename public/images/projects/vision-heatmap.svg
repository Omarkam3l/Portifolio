<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="heat1" cx="45%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat2" cx="70%" cy="40%" r="25%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#030712"/>

  <!-- Perspective Floor Grid -->
  <g stroke="#1e293b" stroke-width="1" fill="none">
    <path d="M 100 380 L 300 160 L 500 160 L 700 380 Z"/>
    <line x1="200" y1="380" x2="350" y2="160"/>
    <line x1="350" y1="380" x2="400" y2="160"/>
    <line x1="500" y1="380" x2="450" y2="160"/>
    <line x1="160" y1="310" x2="640" y2="310"/>
    <line x1="220" y1="240" x2="580" y2="240"/>
  </g>

  <!-- Heatmap density blooms -->
  <circle cx="360" cy="270" r="140" fill="url(#heat1)"/>
  <circle cx="520" cy="230" r="100" fill="url(#heat2)"/>

  <text x="40" y="50" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="bold">PROJECT_SCHEMA // 04 [EXPLORATORY]</text>
  <text x="40" y="80" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">Spatial Heatmap & Vision Analytics</text>
  <text x="40" y="105" fill="#94a3b8" font-family="sans-serif" font-size="14">Surface Occupancy Tracking & Spatial Dwell Pipeline</text>
</svg>
