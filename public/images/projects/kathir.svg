<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-ka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-ka)"/>

  <!-- Flutter/Supabase Food Rescue Flow -->
  <g transform="translate(100, 160)">
    <!-- Donor Card -->
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="45" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">Restaurant Portal</text>
    <text x="80" y="70" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Surplus Listing</text>
    <text x="80" y="90" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">[Flutter App]</text>

    <!-- Arrow 1 -->
    <line x1="160" y1="60" x2="220" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Central AI / Supabase Core -->
    <rect x="220" y="-20" width="180" height="160" rx="8" fill="#151f38" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="25" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14">Supabase + AI Engine</text>
    <text x="310" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Meal Discovery</text>
    <text x="310" y="75" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Recipe Generation</text>
    <text x="310" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Geo Logistics Matching</text>

    <!-- Arrow 2 -->
    <line x1="400" y1="60" x2="460" y2="60" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- NGO Beneficiary Card -->
    <rect x="460" y="0" width="160" height="120" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="540" y="45" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-weight="bold" font-size="14">NGO Dashboard</text>
    <text x="540" y="70" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Instant Intake Claim</text>
    <text x="540" y="90" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">[Flutter App]</text>
  </g>

  <text x="40" y="50" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">PROJECT_SCHEMA // 03</text>
  <text x="40" y="80" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">Kathir</text>
  <text x="40" y="105" fill="#94a3b8" font-family="sans-serif" font-size="14">AI-Assisted Surplus Food Rescue & Matching Platform</text>
</svg>
