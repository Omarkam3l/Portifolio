<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-tf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid-tf" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-tf)"/>
  <rect width="800" height="450" fill="url(#grid-tf)"/>

  <!-- Trace Spans Timeline -->
  <g transform="translate(160, 150)">
    <!-- Root span -->
    <rect x="0" y="0" width="480" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="18" fill="#e0f2fe" font-family="monospace" font-size="11">session.root [420ms]</text>

    <!-- Child span 1 -->
    <rect x="40" y="40" width="220" height="26" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="52" y="57" fill="#c7d2fe" font-family="monospace" font-size="11">event_bus.dispatch() [18ms]</text>

    <!-- Child span 2 -->
    <rect x="120" y="80" width="180" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="132" y="97" fill="#bae6fd" font-family="monospace" font-size="11">recorder.buffer() [12ms]</text>

    <!-- Child span 3 -->
    <rect x="280" y="40" width="200" height="26" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="292" y="57" fill="#fef08a" font-family="monospace" font-size="11">graph_builder.dag() [45ms]</text>

    <!-- Execution DAG nodes -->
    <g transform="translate(60, 140)">
      <circle cx="60" cy="30" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <line x1="74" y1="30" x2="136" y2="30" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="150" cy="30" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
      <line x1="164" y1="30" x2="226" y2="30" stroke="#818cf8" stroke-width="2"/>
      <circle cx="240" cy="30" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
      <text x="60" y="60" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">span_0</text>
      <text x="150" y="60" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">event_bus</text>
      <text x="240" y="60" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">dag_node</text>
    </g>
  </g>

  <text x="40" y="50" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">PROJECT_SCHEMA // 02</text>
  <text x="40" y="80" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">TraceForge</text>
  <text x="40" y="105" fill="#94a3b8" font-family="sans-serif" font-size="14">Python Runtime Tracing & Execution Graph Observability</text>
</svg>
