<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Graph Network Nodes -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" fill="none">
    <line x1="200" y1="225" x2="350" y2="140" />
    <line x1="200" y1="225" x2="350" y2="310" />
    <line x1="350" y1="140" x2="500" y2="180" />
    <line x1="350" y1="310" x2="500" y2="270" />
    <line x1="500" y1="180" x2="650" y2="225" />
    <line x1="500" y1="270" x2="650" y2="225" />
    <line x1="350" y1="140" x2="350" y2="310" stroke-dasharray="4,4" />
  </g>

  <!-- Nodes -->
  <!-- Node 1: Repo -->
  <g transform="translate(200, 225)">
    <circle r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">AST</text>
  </g>

  <!-- Node 2: Neo4j Graph -->
  <g transform="translate(350, 140)">
    <circle r="32" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="bold">Neo4j</text>
  </g>

  <!-- Node 3: Vector Embeddings -->
  <g transform="translate(350, 310)">
    <circle r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#bae6fd" font-family="monospace" font-size="11" font-weight="bold">Vector</text>
  </g>

  <!-- Node 4: Query Router -->
  <g transform="translate(500, 180)">
    <circle r="30" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#e9d5ff" font-family="monospace" font-size="11" font-weight="bold">Router</text>
  </g>

  <!-- Node 5: Reasoner -->
  <g transform="translate(500, 270)">
    <circle r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#bae6fd" font-family="monospace" font-size="11" font-weight="bold">Traverse</text>
  </g>

  <!-- Node 6: Agent Patch -->
  <g transform="translate(650, 225)">
    <circle r="34" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">Patch</text>
  </g>

  <text x="40" y="50" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">PROJECT_SCHEMA // 01</text>
  <text x="40" y="80" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">CodeGraph RAG</text>
  <text x="40" y="105" fill="#94a3b8" font-family="sans-serif" font-size="14">Hybrid Vector + Neo4j Graph Code Intelligence</text>
</svg>
